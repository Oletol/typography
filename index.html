<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Типографика для веба — Cherdak</title>
  <meta name="description" content="Интерактивный курс о выборе шрифтов для веб-страниц: классы шрифтов, начертание, кегль, интерлиньяж, длина строки, пары шрифтов. Проект канала «Чердак», t.me/engattic.">
  <meta name="theme-color" content="#14284A">
  <meta property="og:title" content="Типографика для веба — Cherdak">
  <meta property="og:description" content="Учимся подбирать шрифты для веб-страниц: короткие уроки, песочница и итоговый проект.">
  <meta property="og:image" content="assets/img/logo-512.png">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="apple-touch-icon" href="assets/img/logo-512.png">
  <link rel="preload" href="assets/fonts/onest/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* apply the saved theme before first paint */
    try { var s = JSON.parse(localStorage.getItem("cherdak-type-lab:v1") || "{}"); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
  </script>
</head>
<body>
  <button type="button" class="skip" data-i18n="skip" onclick="document.getElementById('view').focus()">К содержанию</button>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <img class="brand-logo" src="assets/img/logo.svg" alt="" width="40" height="40">
        <span class="brand-name">Cherdak</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="course" data-i18n="navCourse">Курс</a>
        <a href="#/sandbox" data-nav="sandbox" data-i18n="navSandbox">Песочница</a>
        <a href="#/project" data-nav="project" data-i18n="navProject">Итоговый проект</a>
        <a href="#/reading" data-nav="reading" data-i18n="navReading">Литература</a>
        <a href="#/progress" data-nav="progress" data-i18n="navProgress">Прогресс</a>
      </nav>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="themeBtn" data-i18n-aria="themeToggle"></button>
        <div class="lang" role="group" data-i18n-aria="langSwitch">
          <button type="button" class="lang-btn" data-lang="ru">RU</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <p data-i18n="footer"></p>
      <a class="tg-link" href="https://t.me/engattic" target="_blank" rel="noopener">

        <span>@engattic</span>
      </a>
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>

  <script src="assets/js/demos-web.js"></script>

  <script src="assets/js/demos-scale.js"></script>
  <script src="assets/js/demos-pairing.js"></script>
  <script src="assets/js/demos-access.js"></script>
  <script src="assets/js/demos-webfonts.js"></script>
  <script src="assets/js/sandbox.js"></script>
  <script src="assets/js/project-cases.js"></script>
  <script src="assets/js/project.js"></script>
  <script src="assets/js/app.js"></script>

</html>
